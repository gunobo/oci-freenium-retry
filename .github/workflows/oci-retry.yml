name: OCI Always Free Auto-Retry

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

concurrency:
  group: oci-retry
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Run launch.py
        env:
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_COMPARTMENT_OCID: ${{ secrets.OCI_COMPARTMENT_OCID }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
          OCI_VCN_OCID: ${{ secrets.OCI_VCN_OCID }}
          OCI_SUBNET_OCID: ${{ secrets.OCI_SUBNET_OCID }}
          OCI_API_KEY_CONTENT: ${{ secrets.OCI_API_KEY_CONTENT }}
          OCI_API_KEY_FINGERPRINT: ${{ secrets.OCI_API_KEY_FINGERPRINT }}
          OCI_SSH_PUBLIC_KEY: ${{ secrets.OCI_SSH_PUBLIC_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          OCI_SHAPE: ${{ vars.OCI_SHAPE }}
          OCI_OCPUS: ${{ vars.OCI_OCPUS }}
          OCI_MEMORY_GB: ${{ vars.OCI_MEMORY_GB }}
          OCI_DISPLAY_NAME: ${{ vars.OCI_DISPLAY_NAME }}
          OCI_OS: ${{ vars.OCI_OS }}
          OCI_OS_VERSION: ${{ vars.OCI_OS_VERSION }}
          OCI_ARCH: ${{ vars.OCI_ARCH }}
          OCI_BOOT_VOLUME_SIZE_GB: ${{ vars.OCI_BOOT_VOLUME_SIZE_GB }}
        run: python scripts/launch.py
